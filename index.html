<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivre Org Charts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #1a1a2e;
            overflow-y: auto;
            flex-shrink: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .sidebar::-webkit-scrollbar {
            display: none;
        }

        .sidebar-title {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 18px 16px 10px;
            border-bottom: 1px solid #2d2d4a;
        }

        .dept-list {
            list-style: none;
            padding: 6px 0;
        }

        .dept-item {
            padding: 10px 16px;
            color: #a0aec0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .dept-item:hover {
            background: #16213e;
            color: #e2e8f0;
        }

        .dept-item.active {
            background: #0f3460;
            color: #fff;
            border-left-color: #e94560;
            font-weight: 600;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            background: #f0f0f0;
            overflow: hidden;
        }

        .chart-iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-title">Departments</div>
            <ul class="dept-list" id="deptList"></ul>
        </div>
        <div class="chart-wrapper">
            <iframe class="chart-iframe" id="chartIframe"></iframe>
        </div>
    </div>

    <script>
        const departments = [
            { name: "Accounts & Finance", file: "accounts-finance.html" },
            { name: "Human Resource", file: "human-resource.html" },
            { name: "Marketing", file: "marketing.html" },
            { name: "MDO", file: "mdo.html" },
            { name: "Operations (Inbound)", file: "operations-inbound.html" },
            { name: "Operations (Outbound)", file: "operations-outbound.html" },
            { name: "Sales", file: "sales.html" },
            { name: "Software & Tech", file: "software-tech.html" }
        ];

        const deptList = document.getElementById('deptList');
        const iframe = document.getElementById('chartIframe');

        function loadChart(dept) {
            iframe.src = `charts/${dept.file}`;
        }

        departments.forEach((dept) => {
            const li = document.createElement('li');
            li.className = 'dept-item' + (dept.name === 'MDO' ? ' active' : '');
            li.textContent = dept.name;
            li.addEventListener('click', () => {
                document.querySelectorAll('.dept-item').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                loadChart(dept);
            });
            deptList.appendChild(li);
        });

        loadChart(departments.find(d => d.name === 'MDO'));
    </script>
</body>
</html>
