<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivre Org Charts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .tab-bar {
            display: flex;
            gap: 2px;
            background: #1a1a2e;
            padding: 8px 12px;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            min-height: 48px;
            align-items: center;
        }

        .tab-bar::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #16213e;
            color: #a0aec0;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #0f3460;
            color: #e2e8f0;
        }

        .tab-btn.active {
            background: #e94560;
            color: #fff;
        }

        .pdf-wrapper {
            height: calc(100vh - 48px);
            width: 100%;
            position: relative;
        }

        .pdf-iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .note {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            font-weight: normal;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .tab-btn {
                font-size: 11px;
                padding: 6px 12px;
            }
            .note {
                font-size: 10px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <div class="tab-bar" id="tabBar"></div>

    <div class="pdf-wrapper">
        <iframe
            class="pdf-iframe"
            id="pdfIframe"
            type="application/pdf">
        </iframe>
        <div class="note">The names mentioned in the chart after the Director are arranged only on the basis of communication flow and not seniority or hierarchy, and this is being followed as per the FMS / SOP.</div>
    </div>

    <script>
        const departments = [
            "Accounts & Finance",
            "Human Resource",
            "Marketing",
            "MDO",
            "Operations (Inbound)",
            "Operations (Outbound)",
            "Sales",
            "Software & Tech"
        ];

        const tabBar = document.getElementById('tabBar');
        const iframe = document.getElementById('pdfIframe');

        function loadPdf(dept) {
            const encoded = encodeURIComponent(dept);
            iframe.src = `org_chart_files/${encoded}.pdf#toolbar=0&navpanes=0&scrollbar=0&statusbar=0&messages=0&scrollbar=0&view=FitH`;
        }

        departments.forEach((dept, i) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
            btn.textContent = dept;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadPdf(dept);
            });
            tabBar.appendChild(btn);
        });

        loadPdf(departments[0]);
    </script>

</body>
</html>
