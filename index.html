<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivre Org Charts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #1a1a2e;
            overflow-y: auto;
            flex-shrink: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .sidebar::-webkit-scrollbar {
            display: none;
        }

        .sidebar-title {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 18px 16px 10px;
            border-bottom: 1px solid #2d2d4a;
        }

        .dept-list {
            list-style: none;
            padding: 6px 0;
        }

        .dept-item {
            padding: 10px 16px;
            color: #a0aec0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .dept-item:hover {
            background: #16213e;
            color: #e2e8f0;
        }

        .dept-item.active {
            background: #0f3460;
            color: #fff;
            border-left-color: #e94560;
            font-weight: 600;
        }

        .pdf-wrapper {
            flex: 1;
            position: relative;
            background: #f0f0f0;
        }

        .pdf-iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .note {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 160px;
            }
            .dept-item {
                font-size: 11px;
                padding: 8px 12px;
            }
            .note {
                font-size: 10px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-title">Departments</div>
            <ul class="dept-list" id="deptList"></ul>
        </div>
        <div class="pdf-wrapper">
            <iframe class="pdf-iframe" id="pdfIframe" type="application/pdf"></iframe>
            <div class="note"></div>
        </div>
    </div>

    <script>
        const departments = [
            "Accounts & Finance",
            "Human Resource",
            "Marketing",
            "MDO",
            "Operations (Inbound)",
            "Operations (Outbound)",
            "Sales",
            "Software & Tech"
        ];

        const deptList = document.getElementById('deptList');
        const iframe = document.getElementById('pdfIframe');

        function loadPdf(dept) {
            const encoded = encodeURIComponent(dept);
            iframe.src = `org_chart_files/${encoded}.pdf#toolbar=0&navpanes=0&scrollbar=0&statusbar=0&messages=0&scrollbar=0&view=FitH`;
        }

        departments.forEach((dept) => {
            const li = document.createElement('li');
            li.className = 'dept-item' + (dept === 'MDO' ? ' active' : '');
            li.textContent = dept;
            li.addEventListener('click', () => {
                document.querySelectorAll('.dept-item').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                loadPdf(dept);
            });
            deptList.appendChild(li);
        });

        loadPdf('MDO');
    </script>
</body>
</html>
